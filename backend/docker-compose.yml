services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cricheros
      POSTGRES_PASSWORD: cricheros
      POSTGRES_DB: cricheros
    ports:
      - "5434:5432"
    volumes:
      - cricheros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricheros"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://cricheros:cricheros@db:5432/cricheros
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - .:/app

volumes:
  cricheros_pgdata:
